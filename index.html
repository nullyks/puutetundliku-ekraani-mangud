<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Mängud</title>
  <link rel="stylesheet" href="games.css">
</head>
<body>
  <main class="library">
    <header>
      <h1>Mängud</h1>
      <p>Arvuti vastu või kahekesi samal ekraanil.</p>
    </header>

    <nav class="game-list" aria-label="Vali mäng">
      <a class="game-card pong" href="pong.html">
        <div class="preview" aria-hidden="true">
          <div class="field">
            <span class="piece left"></span>
            <span class="piece right"></span>
            <span class="ball"></span>
          </div>
        </div>
        <div class="card-label">
          <h2>Pong</h2>
          <span class="arrow" aria-hidden="true">→</span>
        </div>
      </a>
      <a class="game-card hockey" href="air-hockey.html">
        <div class="preview" aria-hidden="true">
          <div class="field">
            <span class="piece left"></span>
            <span class="piece right"></span>
            <span class="ball"></span>
          </div>
        </div>
        <div class="card-label">
          <h2>Õhuhoki</h2>
          <span class="arrow" aria-hidden="true">→</span>
        </div>
      </a>
      <a class="game-card flight" href="lennujuht.html">
        <div class="preview" aria-hidden="true">
          <div class="field">
            <span class="piece left"></span>
            <span class="piece right"></span>
            <span class="flight-route"></span>
            <span class="ball"></span>
          </div>
        </div>
        <div class="card-label">
          <h2>Lennujuht</h2>
          <span class="arrow" aria-hidden="true">→</span>
        </div>
      </a>
    </nav>
  </main>
</body>
</html>
