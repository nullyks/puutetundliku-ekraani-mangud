<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Pong</title>
  <link rel="stylesheet" href="pong.css">
  <script defer src="pong-engine.js"></script>
  <script defer src="pong.js"></script>
</head>
<body>
  <main class="console">
    <header class="topbar">
      <div class="game-nav">
        <div class="mode" id="mode-label" aria-live="polite">Vali mänguviis</div>
        <a class="switch-game" href="air-hockey.html">Õhuhoki ›</a>
      </div>
      <div class="scoreboard" aria-label="Punktiseis" aria-live="polite">
        <div class="score left"><span id="left-label">Vasak</span><strong id="left-score">0</strong></div>
        <span class="score-divider" aria-hidden="true">:</span>
        <div class="score right"><strong id="right-score">0</strong><span id="right-label">Parem</span></div>
      </div>
      <div class="actions">
        <button id="pause" type="button" disabled>Paus</button>
        <button id="fullscreen" type="button" aria-label="Täisekraan" title="Täisekraan">⛶</button>
      </div>
    </header>

    <section class="court" aria-label="Pongi mänguväljak">
      <canvas id="court" width="960" height="480" aria-label="Pall ja kaks reketit"></canvas>
      <div class="overlay" id="menu">
        <div class="panel">
          <h1 class="game-title">PONG</h1>
          <p>Esimesena 7 punktini.</p>
          <div class="choices">
            <button type="button" class="choice primary" id="solo">Üksinda<span>Arvuti vastu</span></button>
            <button type="button" class="choice secondary" id="duo">Kahekesi<span>Samal ekraanil</span></button>
          </div>
        </div>
      </div>
      <div class="overlay" id="paused" hidden>
        <div class="panel compact">
          <h2>Paus</h2>
          <div class="choices">
            <button type="button" class="choice primary" id="resume">Jätka</button>
            <button type="button" class="choice secondary" id="pause-menu">Menüüsse</button>
          </div>
        </div>
      </div>
      <div class="overlay" id="finished" hidden>
        <div class="panel compact">
          <h2 id="winner"></h2>
          <div class="choices">
            <button type="button" class="choice primary" id="replay">Uus mäng</button>
            <button type="button" class="choice secondary" id="end-menu">Menüüsse</button>
          </div>
        </div>
      </div>
      <div id="serve-note" class="serve-note" hidden>Serv</div>
    </section>

    <footer class="controls">
      <span>Lohista sõrme omal väljakupoolel.</span>
      <span id="duo-keys">Vasak <kbd>W</kbd> <kbd>S</kbd> · parem <kbd>↑</kbd> <kbd>↓</kbd></span>
      <span id="solo-keys" hidden><kbd>W</kbd> <kbd>S</kbd> või <kbd>↑</kbd> <kbd>↓</kbd></span>
    </footer>
    <noscript>Pongi mängimiseks luba brauseris JavaScript.</noscript>
  </main>
</body>
</html>
